name: 🐍 Generate Contribution Snake

on:
  # Runs every 12 hours so the snake stays fresh
  schedule:
    - cron: "0 */12 * * *"
  # Lets you trigger it manually from the Actions tab
  workflow_dispatch:
  # Re-run whenever the README changes
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs from the contribution graph
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: DominatorStufs
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publish to the `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

